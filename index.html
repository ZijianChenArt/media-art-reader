<title>Media Art Radar</title>
<link rel="preload" href="assets/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bodoni-moda-italic-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Cg fill='none' stroke='white' stroke-width='1.6'%3E%3Ccircle cx='16' cy='16' r='9.5'/%3E%3Ccircle cx='16' cy='16' r='4.5'/%3E%3C/g%3E%3Ccircle cx='22.5' cy='9.5' r='2.4' fill='%23D71921'/%3E%3C/svg%3E">

<body>
<a class="skip" href="#stage">跳到内容</a>
<div class="app">
  <aside class="rail">
    <!-- 字标：只有 Media Art。宽度 = 下方方块的宽度，高度 = 右侧标题的高度，基线与标题对齐（由 app.js 精确拟合） -->
    <a class="brand" href="#opportunities" aria-label="Media Art Radar"><span class="brand-t" id="brand-t">Media Art</span></a>

    <nav class="index" aria-label="主要内容">
      <!-- 国际机会精选 = 展览 + 驻留 + 奖项 + 学术会议：一个整体，四个大块 -->
      <section class="group" aria-label="国际机会精选">
        <button class="nav nav-main" type="button" data-route="opportunities" data-filter="all"><span class="n">01</span><strong>国际机会精选</strong><span class="c" data-count="all">—</span></button>
        <button class="nav tile" type="button" data-route="opportunities" data-filter="exhibition"><i class="g" data-g="exhibition"></i><span class="c" data-count="exhibition">—</span><span class="tl"><strong>展览征集</strong><em>Exhibitions</em></span></button>
        <button class="nav tile" type="button" data-route="opportunities" data-filter="residency"><i class="g" data-g="residency"></i><span class="c" data-count="residency">—</span><span class="tl"><strong>驻留</strong><em>Residencies</em></span></button>
        <button class="nav tile" type="button" data-route="opportunities" data-filter="prize"><i class="g" data-g="prize"></i><span class="c" data-count="prize">—</span><span class="tl"><strong>奖项</strong><em>Prizes</em></span></button>
        <button class="nav tile" type="button" data-route="opportunities" data-filter="conference"><i class="g" data-g="conference"></i><span class="c" data-count="conference">—</span><span class="tl"><strong>学术会议</strong><em>Conferences</em></span></button>
      </section>
      <button class="nav mini" type="button" data-route="focus"><span class="n">02</span><strong>本周关注</strong><i>↗</i></button>
      <button class="nav mini" type="button" data-route="widget"><span class="n">03</span><strong>小组件</strong><i>↗</i></button>
      <div class="mini-status" aria-label="期号与核验时间"><span class="live"></span><span id="status-issue">—</span><small id="status-verified"></small></div>
    </nav>
  </aside>

  <main class="stage" id="stage" tabindex="-1">
    <div id="view"></div>
  </main>
</div>
<script src="site-v15.js?v=34" defer></script>
</body>
</html>
