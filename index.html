<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Media Art Radar — 全球媒体艺术机会与创作现场。">
<title>Media Art Radar</title>
<link rel="preload" href="assets/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bodoni-moda-italic-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site-v14.css">
</head>
<body>
<a class="skip" href="#stage">跳到内容</a>
<div class="app">
  <aside class="rail">
    <!-- 字标：MAR 的墨迹宽度由 app.js 精确拉到与下方方块同宽；没有箭头 -->
    <a class="wordmark" href="#opportunities" aria-label="Media Art Radar">
      <span class="mar" id="mar">MAR</span>
      <span class="wordmark-sub"><span>MEDIA</span><span>ART</span><span>RADAR</span></span>
    </a>

    <nav class="rail-nav" aria-label="主要内容">
      <!-- 国际机会精选 = 展览 + 驻留 + 奖项 + 学术会议：一个整体，四个大方块 -->
      <section class="group" aria-label="国际机会精选">
        <button class="tile tile-all" type="button" data-route="opportunities" data-filter="all">
          <span class="tile-n" data-count="all">—</span><i>↗</i><strong>国际机会精选</strong>
        </button>
        <button class="tile tile-exhibition" type="button" data-route="opportunities" data-filter="exhibition">
          <span class="tile-n" data-count="exhibition">—</span><i>↗</i>
          <span class="tile-label"><strong>展览征集</strong><em>Exhibitions</em></span>
        </button>
        <button class="tile tile-residency" type="button" data-route="opportunities" data-filter="residency">
          <span class="tile-n" data-count="residency">—</span><i>↗</i>
          <span class="tile-label"><strong>驻留</strong><em>Residencies</em></span>
        </button>
        <button class="tile tile-prize" type="button" data-route="opportunities" data-filter="prize">
          <span class="tile-n" data-count="prize">—</span><i>↗</i>
          <span class="tile-label"><strong>奖项</strong><em>Prizes</em></span>
        </button>
        <button class="tile tile-conference" type="button" data-route="opportunities" data-filter="conference">
          <span class="tile-n" data-count="conference">—</span><i>↗</i>
          <span class="tile-label"><strong>学术会议</strong><em>Conferences</em></span>
        </button>
      </section>

      <!-- 三个小模块：不重要，所以矮 -->
      <button class="tile mini mini-focus" type="button" data-route="focus">
        <span class="tile-n">02</span><strong>本周关注</strong><i>↗</i>
      </button>
      <button class="tile mini mini-widget" type="button" data-route="widget">
        <span class="tile-n">03</span><strong>小组件</strong><i>↗</i>
      </button>
      <div class="mini mini-status" aria-label="期号与核验时间">
        <span class="live"></span><span id="status-issue">—</span><small id="status-verified"></small>
      </div>
    </nav>
  </aside>

  <main class="stage" id="stage" tabindex="-1">
    <div id="view"></div>
  </main>
</div>
<script src="site-v14.js" defer></script>
</body>
</html>
