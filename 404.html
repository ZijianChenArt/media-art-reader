<!doctype html>

<title>页面不存在 · Media Art Radar</title>
<!-- GitHub Pages 会在任意深度的缺失路径上返回这个页面，所以内部链接与字体一律用根绝对路径，并且不依赖 style.css（那是首页应用的样式）。 -->
<style>
  @font-face{font-family:Grotesk;src:url("/media-art-reader/assets/fonts/space-grotesk-var.woff2") format("woff2");font-weight:400 700;font-display:swap}
  @font-face{font-family:Bodoni;src:url("/media-art-reader/assets/fonts/bodoni-moda-italic-var.woff2") format("woff2");font-style:italic;font-weight:400 900;font-display:swap}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#050505;font-family:Grotesk,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100vh;padding:clamp(28px,6vw,72px) clamp(20px,6vw,72px);display:flex;flex-direction:column}
  .mar{font-family:Bodoni,Georgia,serif;font-style:italic;font-size:2.2rem;font-weight:600;letter-spacing:-.03em;line-height:.8;text-decoration:none;color:inherit}
  h1{margin:auto 0 0;font-size:clamp(3.4rem,14vw,8rem);line-height:.92;letter-spacing:-.065em}
  h1 em{display:block;font-family:Bodoni,Georgia,serif;font-weight:500;font-size:1.1em;letter-spacing:-.04em}
  p{margin:32px 0 0;font-size:.95rem;line-height:1.8;color:#6d6d72;max-width:38ch}
  .back{display:inline-flex;align-items:center;align-self:flex-start;margin-top:28px;min-height:50px;padding:0 26px;border-radius:999px;background:#050505;color:#fff;font-weight:700;text-decoration:none}
  .back:hover{opacity:.8}
  footer{margin-top:auto;padding-top:56px;font-size:.7rem;color:#6d6d72;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <a class="mar" href="/media-art-reader/" aria-label="Media Art Radar 首页">Media Art</a>
  <h1>页面<em>不存在.</em></h1>
  <p>这个地址没有对应的内容。可能是链接写错了，或者该期周刊已经调整。</p>
